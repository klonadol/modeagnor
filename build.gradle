plugins { id 'fabric-loom' version '1.7.4' }

version = project.mod_version
group = project.maven_group

repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
loom {
    splitEnvironmentSourceSets()
    mods { agnor { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 21 }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21; withSourcesJar() }
test { useJUnitPlatform() }

// Opt-in Phase 0 network harness, never included in the mod JAR.
if (providers.gradleProperty('phase0').isPresent()) {
    apply from: 'scripts/phase0.gradle'
}
